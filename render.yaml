# Render Blueprint: creates the web service (Docker) + a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: tripmate-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Render asks you to paste the value
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"           # later: your Vercel URL
      - key: DATABASE_URL
        fromDatabase:
          name: tripmate-db
          property: connectionString

databases:
  - name: tripmate-db
    plan: free
