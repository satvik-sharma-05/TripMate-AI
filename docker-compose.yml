# `docker compose up --build` -> app on http://localhost:8000 with a PostgreSQL database.
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tripmate
    depends_on: [db]
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripmate
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
